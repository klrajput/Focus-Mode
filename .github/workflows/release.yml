# Focus Mode — desktop release pipeline (T-112 + T-113).
# Triggered by a maintainer-pushed `v*` tag (or manually via workflow_dispatch = dry-run build,
# no release). Each runner builds installers for its own OS with electron-builder and uploads
# them as workflow artifacts; a per-OS smoke job proves the agent boots headless; a final job
# creates a DRAFT GitHub release from the installer artifacts on tag pushes only.
# Signing/notarisation is optional — every job must pass unsigned.
# Third-party actions are pinned to full 40-char commit SHAs with their source tag in a comment
# (re-verified 2026-11-10 with `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Never cancel a release build halfway through; one release per ref at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Release builds do not run server tests, so skip mongodb-memory-server's ~100 MB mongod
  # postinstall download on every runner (it is only needed by `npm test`).
  MONGOMS_DISABLE_POSTINSTALL: 'true'

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: NSIS installer + portable exe (both x64, per electron-builder.yml).
          - name: windows-x64
            os: windows-latest
            args: --win --x64
            artifact-pattern: |
              agent/release/*.exe
          # macOS: dmg + zip, one runner per architecture (macos-15-intel is the x64 image;
          # macos-13 is retired — never use it).
          - name: macos-arm64
            os: macos-latest
            args: --mac --arm64
            artifact-pattern: |
              agent/release/*.dmg
              agent/release/*.zip
          - name: macos-x64
            os: macos-15-intel
            args: --mac --x64
            artifact-pattern: |
              agent/release/*.dmg
              agent/release/*.zip
          # Linux: AppImage + deb (x64).
          - name: linux-x64
            os: ubuntu-24.04
            args: --linux --x64
            artifact-pattern: |
              agent/release/*.AppImage
              agent/release/*.deb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # `shared` must be compiled before the agent's tsc run resolves @focus-mode/shared.
      - name: Build shared protocol package
        run: npm run build --workspace shared

      - name: Build Focus Agent
        run: npm run build --workspace agent

      # Optional signing must be *absent* when the secrets are not configured: passing
      # `CSC_LINK: ''` makes electron-builder treat it as a configured certificate and fail on
      # macOS with "/…/agent not a file" (observed in the first W4 dispatch). Export only values
      # that actually exist; absent secrets mean a genuinely unsigned build.
      - name: Configure optional signing environment
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CSC_LINK_SECRET:-}" ]; then
            {
              echo "CSC_LINK=${CSC_LINK_SECRET}"
              echo "CSC_KEY_PASSWORD=${CSC_KEY_PASSWORD_SECRET:-}"
            } >> "$GITHUB_ENV"
            echo "code signing: enabled (certificate supplied via repository secrets)"
          else
            echo "code signing: disabled (no CSC_LINK secret) — building UNSIGNED, as documented"
          fi
          if [ -n "${APPLE_ID_SECRET:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD_SECRET:-}" ] && [ -n "${APPLE_TEAM_ID_SECRET:-}" ]; then
            {
              echo "APPLE_ID=${APPLE_ID_SECRET}"
              echo "APPLE_APP_SPECIFIC_PASSWORD=${APPLE_APP_SPECIFIC_PASSWORD_SECRET}"
              echo "APPLE_TEAM_ID=${APPLE_TEAM_ID_SECRET}"
            } >> "$GITHUB_ENV"
            echo "notarisation: enabled (APPLE_* secrets supplied)"
          else
            echo "notarisation: disabled (APPLE_* secrets absent) — no signing identity is imported"
          fi

      - name: Build installers
        working-directory: agent
        # Signing/notarisation env comes from the previous step via $GITHUB_ENV (only when set).
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: List produced artifacts
        working-directory: agent
        shell: bash
        run: ls -l release

      # Zero-trust packaging checks (W6/T-080): the `afterPack` hook in agent/electron-builder.yml
      # flips Electron fuses, and the files/asar config keeps secrets and sources out of app.asar.
      # These steps prove both on the artifact that is about to be uploaded — a build with insecure
      # defaults (RunAsNode / NODE_OPTIONS / --inspect enabled, app not loaded only from asar) or
      # with a shipped .env/.pem/.key fails here instead of reaching a release.
      - name: Verify Electron fuses (macOS/Windows)
        # Linux has no Electron-fuse equivalent inside AppImage/deb: the read tool is not supported
        # for those payloads, so Linux installations rely on the asar-content guard below plus the
        # documented caveat in docs/RELEASING.md §11 (fuses are still flipped before packaging).
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          FUSES="$GITHUB_WORKSPACE/node_modules/.bin/electron-fuses"
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP=$(find agent/release -maxdepth 2 -name '*.app' -type d | head -n 1)
          else
            APP=$(find agent/release/win-unpacked -maxdepth 1 -name '*.exe' \
              ! -name 'elevate.exe' ! -name 'crashpad_handler.exe' ! -name 'notification_helper.exe' | head -n 1)
          fi
          if [ -z "${APP:-}" ]; then
            echo "FAIL: no packaged app found for fuse inspection"
            exit 1
          fi
          echo "reading fuses from: $APP"
          FUSE_OUTPUT=$("$FUSES" read --app "$APP" 2>&1)
          echo "$FUSE_OUTPUT"
          for expected in \
            "RunAsNode is Disabled" \
            "EnableNodeOptionsEnvironmentVariable is Disabled" \
            "EnableNodeCliInspectArguments is Disabled" \
            "OnlyLoadAppFromAsar is Enabled" \
            "GrantFileProtocolExtraPrivileges is Disabled"; do
            if ! grep -qF "$expected" <<< "$FUSE_OUTPUT"; then
              echo "FAIL: fuse assertion missing: $expected"
              exit 1
            fi
          done
          if [ "$RUNNER_OS" = "macOS" ] && ! grep -qF "EnableEmbeddedAsarIntegrityValidation is Enabled" <<< "$FUSE_OUTPUT"; then
            echo "FAIL: macOS embedded asar-integrity fuse is not enabled"
            exit 1
          fi
          echo "PASS Electron fuses verified ($RUNNER_OS)"

      - name: Verify packaged app.asar contents (no secrets/certs/sources)
        shell: bash
        run: |
          set -euo pipefail
          ASAR_PATH=$(find agent/release -type f -name 'app.asar' | head -n 1)
          if [ -z "${ASAR_PATH:-}" ]; then
            echo "FAIL: no app.asar found in agent/release"
            exit 1
          fi
          export ASAR_PATH
          node - <<'NODE'
          const asar = require('@electron/asar');
          const asarPath = process.env.ASAR_PATH;
          const entries = asar.listPackage(asarPath);
          const required = ['/dist/main.js', '/dist/ui/index.html', '/dist/ui/preload.cjs', '/package.json'];
          const missing = required.filter((entry) => !entries.includes(entry));
          // Secrets/certs must never be packaged, app sources must not leak, and our own compiled
          // output must not ship source maps or test files. Dependency internals (e.g.
          // node_modules/@focus-mode/shared/dist/*.map, the published payload of a workspace dep)
          // are out of scope here and would be caught by the secret pattern if they were secrets.
          const secretRe = /(^|\/)\.env(\.|$)|\.(pem|key|p12|pfx|cer|mobileprovision|jks|keystore)$/i;
          const appSourceRe = /^\/src\//;
          const appMapOrTestRe = /^\/(dist\/.*\.map|.*\.test\.[cm]?[jt]s)$/;
          const fatal = entries.filter(
            (entry) => secretRe.test(entry) || appSourceRe.test(entry) || appMapOrTestRe.test(entry),
          );
          console.log(`app.asar: ${asarPath}`);
          console.log(`total entries: ${entries.length}`);
          console.log(`required present: ${required.length - missing.length}/${required.length}`);
          if (missing.length) console.log('FAIL missing entries:', missing);
          if (fatal.length) console.log('FAIL forbidden entries:', fatal.slice(0, 20));
          if (missing.length || fatal.length) process.exit(1);
          console.log('PASS app.asar contents verified (dist-only app code, no secrets/certs/sources)');
          NODE

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focus-agent-${{ matrix.name }}
          path: ${{ matrix.artifact-pattern }}
          if-no-files-found: error
          retention-days: 14

  smoke:
    # T-113: real AGENT_SMOKE run on every OS. This job asserts BOTH:
    #   1. the build job really produced the expected installers for this OS — they are downloaded
    #      here and each file's size + sha256 is printed (`focus-agent-<name>` artifact);
    #   2. the agent starts with AGENT_SMOKE=1, binds 127.0.0.1, answers one `hello`
    #      (paired=false, IDLE), answers `getState` (IDLE, no session) and exits 0 by itself —
    #      scripts/smoke/launch.mjs fails with exit 1 on any deviation (its 20 s failsafe exits 1).
    # HONEST LIMITATION: launch.mjs resolves the Electron executable from the checkout and drives
    # the app directory built from source (`agent/dist`), so it does NOT prove the *installed*
    # artifact boots out of the asar/dmg/exe/AppImage. Installer-level launch needs a launcher
    # extension (tracked as a T-113 follow-up in docs/RELEASING.md §8); this job never claims it.
    name: smoke (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            installer-extensions: .exe
          - name: macos-arm64
            os: macos-latest
            installer-extensions: .dmg,.zip
          - name: macos-x64
            os: macos-15-intel
            installer-extensions: .dmg,.zip
          - name: linux-x64
            os: ubuntu-24.04
            installer-extensions: .AppImage,.deb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build shared protocol package
        run: npm run build --workspace shared

      - name: Build Focus Agent
        run: npm run build --workspace agent

      - name: Download installers produced by the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: focus-agent-${{ matrix.name }}
          path: smoke-assets

      - name: Verify installer artifacts (sizes + sha256)
        shell: bash
        env:
          INSTALLER_EXTENSIONS: ${{ matrix.installer-extensions }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const dir = 'smoke-assets';
          const expected = process.env.INSTALLER_EXTENSIONS.split(',').map((e) => e.trim()).filter(Boolean);
          const files = fs.existsSync(dir)
            ? fs.readdirSync(dir).filter((f) => fs.statSync(path.join(dir, f)).isFile()).sort()
            : [];
          let failures = 0;
          for (const file of files) {
            const full = path.join(dir, file);
            const size = fs.statSync(full).size;
            const sha256 = crypto.createHash('sha256').update(fs.readFileSync(full)).digest('hex');
            console.log(`${file}\t${size} bytes\tsha256=${sha256}`);
            if (size < 1024 * 1024) {
              console.log(`FAIL installer ${file} is suspiciously small (${size} bytes)`);
              failures++;
            }
          }
          for (const ext of expected) {
            if (!files.some((f) => f.endsWith(ext))) {
              console.log(`FAIL missing expected installer extension ${ext}`);
              failures++;
            }
          }
          console.log(
            failures === 0
              ? `PASS installer artifacts present: ${files.length} file(s), expected [${expected.join(', ')}]`
              : `FAIL ${failures} installer artifact check(s) failed`,
          );
          process.exit(failures === 0 ? 0 : 1);
          NODE

      # Chromium needs a display on Linux; the headless smoke app is launched under Xvfb.
      - name: Install Xvfb if the runner image lacks it
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi

      - name: AGENT_SMOKE run (Linux, under Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a node scripts/smoke/launch.mjs 2>&1 | tee smoke.log

      - name: AGENT_SMOKE run (Windows/macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -o pipefail
          node scripts/smoke/launch.mjs 2>&1 | tee smoke.log

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-log-${{ matrix.name }}
          path: smoke.log
          if-no-files-found: warn
          retention-days: 14

  release:
    name: publish draft GitHub release
    # Tag pushes only: workflow_dispatch runs are build+smoke-only dry runs.
    if: startsWith(github.ref, 'refs/tags/v')
    # Both the installers and the per-OS AGENT_SMOKE runs must be green before a draft exists.
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # `pattern` keeps the smoke-log-* artifacts out of the release assets.
      - name: Download all installer artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: focus-agent-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        shell: bash
        run: |
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --draft \
            --title "Focus Mode Agent ${GITHUB_REF_NAME}" \
            --notes "Automated draft from .github/workflows/release.yml. Install steps, unsigned-build caveats and per-OS artifact list: docs/RELEASING.md."
